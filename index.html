<!doctype html>

<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8">
    <title>anime skies</title>
    <script src="./modal.js"></script>
    <script src="./imageAnalysis.js"></script>
    <style>
      body {
        text-align: center;
        font-family: Helvetica;
      }
      
      header {
        display: flex;
        gap: 5%;
        margin-bottom: 15px;
        align-items: center;
        overflow-x: auto;
        
        /* don't use justify-content: center as 
           that hides the buttons on smaller screens :/
           
           instead we can use auto for the margins of the first and
           last children of the header to center the header's children
           so things look fine on large screens and everything will
           still show (but with overflow scroll) on smaller screens
        */
      }
      
      header > :first-child {
        margin-left: auto;
      }
      
      header > :last-child {
        margin-right: auto;
      }
      
      button {
        border: 1px solid transparent;
        padding: 0.4em 1.0em;
        font-size: 1em;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        background-color: transparent;
      }
      
      button:hover {
        border: 1px solid #ccc !important;
        transition: 1s;
      }
      
      img {
        width: 100%;
      }

      .opt {
        display: flex;
        align-items: center;
      }
      
      .preview {
        opacity: 0.7;
        position: absolute;
        z-index: -1;
        background-size: cover;
        border: 1px solid #ccc;
        top: 10vh;
      }
      
      .grid-cell {
        border: 1px solid #ccc;
        height: 200px;
        width: 8%;
        background-size: cover;
        align-self: flex-start;
        margin-bottom: 20px;
      }
      
      .grid-cell:hover {
        cursor: pointer;
      }
      
      #display {
        margin: 0 auto;
        width: 70%;
        height: 50%;
        touch-action: none; /* for handling pointer events properly */
      }
      
      #source {
        font-weight: bold;
      }
      
      #options {
        display: flex;
        justify-content: center;
        gap: 2em;
      }
      
      #options p, label {
        font-size: 0.8em;
      }
      
      #displayDurationInput, #transitionDurationInput {
        appearance: none;
        background-color: #ccc;
        height: 4px;
      }
      
      #displayDurationInput::-webkit-slider-thumb, 
      #transitionDurationInput::-webkit-slider-thumb {
        appearance: none;
        width: 0.5vw;
        height: 1.5vh;
        border: 1px solid #2196f3;
        border-radius: 2px;
        cursor: pointer;
        background-color: #fff;
      }
      
      /* because firefox has their own slider thumb pseudo-element */
      #displayDurationInput::-moz-range-thumb, 
      #transitionDurationInput::-moz-range-thumb {
        appearance: none;
        width: 0.5vw;
        height: 1.5vh;
        border: 1px solid #2196f3;
        border-radius: 2px;
        cursor: pointer;
        background-color: #fff;
      }
      
      #grid {
        display: none;
        position: relative;
        gap: 1%;
        flex-wrap: wrap;
        left: -1000px;
        align-items: center;
        justify-content: center;
      }
      
      #slideshow {
        display: block;
        position: relative;
      }
      
      #slideshowMode {
        border: 1px solid #2196f3;
      }
      
      .slideRight {
        animation: slideRight 1s forwards;
      }
      
      @keyframes slideRight {
        100% {
          left: 0px;
        }
      }
    </style>
  </head>
  
  <body>
    <header>
      <button id='slideshowMode' title='slideshow'>
        <!-- from https://iconoir.com/ (transition-right) -->
        <svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M2 18V6C2 4.34315 3.34315 3 5 3H7C8.65685 3 10 4.34315 10 6V18C10 19.6569 8.65685 21 7 21H5C3.34315 21 2 19.6569 2 18Z" stroke="#000000" stroke-width="1.5"></path><path d="M16 3H18C20.2091 3 22 4.79086 22 7V17C22 19.2091 20.2091 21 18 21H16" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 12H18M18 12L15 9M18 12L15 15" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      
      <button id='gridMode' title='grid'>
        <!-- from https://iconoir.com/ (grid) -->
        <svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M14 20.4V14.6C14 14.2686 14.2686 14 14.6 14H20.4C20.7314 14 21 14.2686 21 14.6V20.4C21 20.7314 20.7314 21 20.4 21H14.6C14.2686 21 14 20.7314 14 20.4Z" stroke="#000000" stroke-width="1.5"></path><path d="M3 20.4V14.6C3 14.2686 3.26863 14 3.6 14H9.4C9.73137 14 10 14.2686 10 14.6V20.4C10 20.7314 9.73137 21 9.4 21H3.6C3.26863 21 3 20.7314 3 20.4Z" stroke="#000000" stroke-width="1.5"></path><path d="M14 9.4V3.6C14 3.26863 14.2686 3 14.6 3H20.4C20.7314 3 21 3.26863 21 3.6V9.4C21 9.73137 20.7314 10 20.4 10H14.6C14.2686 10 14 9.73137 14 9.4Z" stroke="#000000" stroke-width="1.5"></path><path d="M3 9.4V3.6C3 3.26863 3.26863 3 3.6 3H9.4C9.73137 3 10 3.26863 10 3.6V9.4C10 9.73137 9.73137 10 9.4 10H3.6C3.26863 10 3 9.73137 3 9.4Z" stroke="#000000" stroke-width="1.5"></path></svg>
      </button>
      
      <button id='analyzeSky' title='get current sky color palette' onclick='analyzeImage(skies[skyIndex])'>
        <!-- from https://iconoir.com/ (palette) -->
        <svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M20.5096 9.54C20.4243 9.77932 20.2918 9.99909 20.12 10.1863C19.9483 10.3735 19.7407 10.5244 19.5096 10.63C18.2796 11.1806 17.2346 12.0745 16.5002 13.2045C15.7659 14.3345 15.3733 15.6524 15.3696 17C15.3711 17.4701 15.418 17.9389 15.5096 18.4C15.5707 18.6818 15.5747 18.973 15.5215 19.2564C15.4682 19.5397 15.3588 19.8096 15.1996 20.05C15.0649 20.2604 14.8877 20.4403 14.6793 20.5781C14.4709 20.7158 14.2359 20.8085 13.9896 20.85C13.4554 20.9504 12.9131 21.0006 12.3696 21C11.1638 21.0006 9.97011 20.7588 8.85952 20.2891C7.74893 19.8194 6.74405 19.1314 5.90455 18.2657C5.06506 17.4001 4.40807 16.3747 3.97261 15.2502C3.53714 14.1257 3.33208 12.9252 3.36959 11.72C3.4472 9.47279 4.3586 7.33495 5.92622 5.72296C7.49385 4.11097 9.60542 3.14028 11.8496 3H12.3596C14.0353 3.00042 15.6777 3.46869 17.1017 4.35207C18.5257 5.23544 19.6748 6.49885 20.4196 8C20.6488 8.47498 20.6812 9.02129 20.5096 9.52V9.54Z" stroke="#000000" stroke-width="1.5"></path><path d="M8 16.01L8.01 15.9989" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M6 12.01L6.01 11.9989" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M8 8.01L8.01 7.99889" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 6.01L12.01 5.99889" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M16 8.01L16.01 7.99889" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      
      <div id='options'>
        <div class='opt'>
          <p> display: </p>
          <input id='displayDurationInput' type='range' value='3000' min='500' max='10000' />
          <label for='displayDurationInput' id='displayDurationLabel'> 3000 ms </label>
        </div>
        
        <div class='opt'>
          <p> transition: </p>
          <input id='transitionDurationInput' type='range' value='1000' min='100' max='3000' /> 
          <label for='transitionDurationInput' id='transitionDurationLabel'> 1000 ms </label>
        </div>
      </div>
      
      <button id='toggleDarkMode' title='toggle dark/light mode'>
        <!-- from https://iconoir.com/ (moon) -->
        <svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M3 11.5066C3 16.7497 7.25034 21 12.4934 21C16.2209 21 19.4466 18.8518 21 15.7259C12.4934 15.7259 8.27411 11.5066 8.27411 3C5.14821 4.55344 3 7.77915 3 11.5066Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
    </header>
    
    <content>
      <!-- slideshow mode -->
      <div id='slideshow'>
        <canvas id='display' class='transition'>
        </canvas>
        <p id='source'>source</p>
      </div>
      
      <!-- grid mode -->
      <div id='grid'>
      </div>
    </content>
    
    <script>
      let skyIndex = 0;
      let skies = [];
      let maxCanvasWidth = 0;
      let maxCanvasHeight = 0;
      let lastTime = new Date();
      let slideshowOn = true;
      let lastCanvasClickPos = null;
      let darkMode = false;
      
      let displayDuration = 3000; // 3 sec
      let transitionDuration = 1000; // 1 sec
      
      const modalManager = new Modal();
      
      const computedStyle = getComputedStyle(document.getElementById('display'));
      maxCanvasWidth = parseInt(computedStyle.getPropertyValue('width'));
      maxCanvasHeight = parseInt(computedStyle.getPropertyValue('height'));
      
      document.getElementById('displayDurationInput').addEventListener('change', (evt) => {
        displayDuration = parseInt(evt.target.value);
      });
      
      document.getElementById('displayDurationInput').addEventListener('input', (evt) => {
        document.getElementById('displayDurationLabel').textContent = `${evt.target.value} ms`;
      });
      
      document.getElementById('transitionDurationInput').addEventListener('change', (evt) => {
        transitionDuration = parseInt(evt.target.value);
      });
      
      document.getElementById('transitionDurationInput').addEventListener('input', (evt) => {
        document.getElementById('transitionDurationLabel').textContent = `${evt.target.value} ms`;
      });
      
      // clicking on slideshow button
      document.getElementById('slideshowMode').addEventListener('click', () => {
        const slideshowContent = document.getElementById('slideshow');
        const slideshowBtn = document.getElementById('slideshowMode');
        const gridBtn = document.getElementById('gridMode');
        const gridContent = document.getElementById('grid');
        
        // if currently on slideshow mode but user wants to turn off/on slideshow
        if(slideshowContent.style.display === 'block' ||
           slideshowContent.style.display === '')
        {
          slideshowOn = !slideshowOn;
          if(!slideshowOn){
            slideshowBtn.style.border = '1px solid transparent';
            turnOffSlideshow();
          }else{
            slideshowBtn.style.border = '1px solid #2196f3';
            turnOnSlideshow();
          }
        }
        
        // display slideshow content
        if(slideshowContent.style.display === 'none'){
          slideshowContent.style.display = 'block';
          
          gridContent.style.display = 'none';
          gridContent.style.left = '-1000px';
          
          // animate slideshow slide
          slideshowContent.classList.add('slideRight');
          
          // indicate current mode
          if(slideshowOn) slideshowBtn.style.border = '1px solid #2196f3';
          gridBtn.style.border = '1px solid transparent';
        }
      });
      
      // clicking on grid button
      document.getElementById('gridMode').addEventListener('click', () => {
        const slideshowContent = document.getElementById('slideshow');
        const slideshowBtn = document.getElementById('slideshowMode');
        const gridBtn = document.getElementById('gridMode');
        const gridContent = document.getElementById('grid');
        
        // display grid content
        if(gridContent.style.display === 'none' || 
           gridContent.style.display === '')
        {
          gridContent.style.display = 'flex';
          
          slideshowContent.style.display = 'none';
          slideshowContent.style.left = '-1000px';
          
          // animate grid slide
          gridContent.classList.add('slideRight');
          
          // indicate current mode
          slideshowBtn.style.border = '1px solid transparent';
          gridBtn.style.border = '1px solid #2196f3';
        }
      });
      
      // toggle dark/light mode
      document.getElementById('toggleDarkMode').addEventListener('click', (evt) => {
        const white = 'rgb(255, 255, 255)';
        const black = 'rgb(20, 20, 20)';
        
        darkMode = !darkMode;
        
        if(darkMode){
          // svg icon from iconoir.com (sun)
          evt.target.innerHTML = '<svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M22 12L23 12" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 2V1" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 23V22" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 20L19 19" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M20 4L19 5" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 20L5 19" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 4L5 5" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1 12L2 12" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
          
          // dark mode
          document.body.style.backgroundColor = black;
          document.body.style.color = white;
          document.querySelectorAll('path').forEach(path => path.style.stroke = '#fff');
          document.querySelectorAll('button').forEach(btn => btn.style.color = white);
        }else{
          // svg icon from iconoir.com (moon)
          evt.target.innerHTML = '<svg width="24px" height="24px" stroke-width="1.5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000"><path d="M3 11.5066C3 16.7497 7.25034 21 12.4934 21C16.2209 21 19.4466 18.8518 21 15.7259C12.4934 15.7259 8.27411 11.5066 8.27411 3C5.14821 4.55344 3 7.77915 3 11.5066Z" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
          
          // light mode
          document.body.style.backgroundColor = white;
          document.body.style.color = black;
          document.querySelectorAll('path').forEach(path => path.style.stroke = '#000');
          document.querySelectorAll('button').forEach(btn => btn.style.color = black);
        }
      });
      
      function getLastIndex(){
        // get index of the sky pic that comes before the current one
        if((skyIndex - 1) % skies.length < 0){
          return ((skyIndex - 1) % skies.length) + skies.length;
        }
        return (skyIndex - 1) % skies.length;
      }
      
      function canvasPointerdown(evt){
        const canvas = document.getElementById('display');
        const rect = canvas.getBoundingClientRect();
        const newX = evt.clientX - rect.left;
        const newY = evt.clientY - rect.top;
        lastCanvasClickPos = {x: newX, y: newY};
      }
      
      function canvasPointerup(evt){
        const canvas = document.getElementById('display');
        const rect = canvas.getBoundingClientRect();
        const newX = evt.clientX - rect.left;
        const newY = evt.clientY - rect.top;
        if(lastCanvasClickPos){
          const deltaX = newX - lastCanvasClickPos.x;
          if(deltaX < 0){
            // swipe left, advance sky image index
            skyIndex = (skyIndex + 1) % skies.length;
          }else if(deltaX > 0){
            // swipe right, go backwards
            skyIndex = getLastIndex();
          }
          
          setSkyImageOnCanvas(canvas, skies[skyIndex]);
          
          document.querySelectorAll('.preview').forEach(p => p.parentNode.removeChild(p));
          setupPreviews();
        }
      }
      
      function showNextSkyKeypress(){
        const canvas = document.getElementById('display');
        skyIndex = (skyIndex + 1) % skies.length;
        setSkyImageOnCanvas(canvas, skies[skyIndex]);
        document.querySelectorAll('.preview').forEach(p => p.parentNode.removeChild(p));
        setupPreviews();
      }
      
      function showPrevSkyKeypress(){
        const canvas = document.getElementById('display');
        skyIndex = getLastIndex();
        setSkyImageOnCanvas(canvas, skies[skyIndex]);
        document.querySelectorAll('.preview').forEach(p => p.parentNode.removeChild(p));
        setupPreviews();
      }
      
      function handleKeypressEvt(evt){
        if(evt.code === 'ArrowLeft'){
          showPrevSkyKeypress();
        }else if(evt.code === 'ArrowRight'){
          showNextSkyKeypress();
        }
      }
      
      function setupPreviews(){
        const canvas = document.getElementById('display');
        
        const computedStyle = getComputedStyle(canvas);
        const displayWidth = parseInt(computedStyle.getPropertyValue('width')) * 0.3;
        const displayHeight = parseInt(computedStyle.getPropertyValue('height')) * 0.3;
        
        // show next/prev sky previews
        const lastIndex = getLastIndex();
        const width = `${displayWidth}px`;
        const height = `${displayHeight}px`;
        
        const lastPreview = document.createElement('div');
        lastPreview.style.backgroundImage = `url("${skies[lastIndex].image.src}")`;
        lastPreview.style.left = '-5vw';
        lastPreview.style.width = width;
        lastPreview.style.height = height;
        lastPreview.style.transform = 'perspective(50rem) rotateY(-45deg)';
        lastPreview.classList.add('preview');
        
        const nextPreview = document.createElement('div');
        nextPreview.style.backgroundImage = `url("${skies[(skyIndex + 1) % skies.length].image.src}")`;
        nextPreview.style.right = '-5vw';
        nextPreview.style.width = width;
        nextPreview.style.height = height;
        nextPreview.style.transform = 'perspective(50rem) rotateY(45deg)';
        nextPreview.classList.add('preview');
        
        canvas.parentNode.insertBefore(lastPreview, canvas);
        canvas.after(nextPreview);
      }
      
      function turnOffSlideshow(){
        const canvas = document.getElementById('display');
        
        // set opacity of related elements to 1.0 in case they were fading out
        canvas.style.opacity = 1.0;
        document.getElementById('source').style.opacity = 1.0;
        
        // show next/prev sky previews
        setupPreviews();
        
        // set controls to traverse sky pics
        canvas.addEventListener('pointerdown', canvasPointerdown);
        canvas.addEventListener('pointerup', canvasPointerup);
        
        //set arrow key listeners for left/right
        window.addEventListener('keydown', handleKeypressEvt);
      }
      
      function turnOnSlideshow(){
        const canvas = document.getElementById('display');
        
        // show slideshow-related elements (e.g. transition controls)
        document.getElementById('options').style.display = 'flex';
        
        // remove controls to traverse sky pics
        canvas.removeEventListener('pointerdown', canvasPointerdown);
        canvas.removeEventListener('pointerup', canvasPointerup);
        window.removeEventListener('keydown', handleKeypressEvt);
        
        // remove next/prev sky previews
        document.querySelectorAll('.preview').forEach(p => p.parentNode.removeChild(p));
      }
      
      function setSkyImageOnCanvas(canvas, sky){
        const ctx = canvas.getContext('2d');
        
        if(sky.image){
          const imgWidth = sky.image.width;
          const imgHeight = sky.image.height;
          
          if(imgWidth > maxCanvasWidth || imgHeight > maxCanvasHeight){
            // resize canvas
            const heightToWidthRatio = imgHeight / imgWidth;
            let newCanvasWidth = imgWidth;
            let newCanvasHeight = imgHeight;
            
            while(newCanvasWidth > maxCanvasWidth || newCanvasHeight > maxCanvasHeight){
              newCanvasWidth -= 1;
              newCanvasHeight -= heightToWidthRatio;
            }
            
            canvas.width = newCanvasWidth;
            canvas.height = newCanvasHeight;
          }
          
          ctx.drawImage(sky.image, 0, 0, canvas.width, canvas.height);
          
          const skySourceElement = document.getElementById('source');
          
           // set image source text as specified in json
          skySourceElement.textContent = sky.source;
        }
      }
      
      function createSkiesGrid(parentElement, skies){
        skies.forEach(sky => {
          const gridCell = document.createElement('div');
          gridCell.classList.add('grid-cell');
          gridCell.style.backgroundImage = `url("${sky.path}")`;
          
          gridCell.addEventListener('click', () => {
            modalManager.createModal(sky);
          });
          
          parentElement.appendChild(gridCell);
        });
      }
      
      function showSkies(){
        if(!slideshowOn){
          requestAnimationFrame(showSkies);
          return;
        }
        const currTime = new Date();
        const canvas = document.getElementById('display');
        const skySourceElement = document.getElementById('source');
        
        // transition in
        if(currTime - lastTime < transitionDuration){
          // opacity should get closer to 1.0
          const opacity = (currTime - lastTime) / transitionDuration;
          canvas.style.opacity = opacity;
          skySourceElement.style.opacity = opacity;
        }
        
        // transition out
        if(currTime - lastTime >= (displayDuration + transitionDuration) && 
           currTime - lastTime < (displayDuration + (2 * transitionDuration))
        ){
          // opacity should get closer to 0.0
          const opacity = 1.0 - (currTime - lastTime - (displayDuration + transitionDuration)) / transitionDuration;
          canvas.style.opacity = opacity;
          skySourceElement.style.opacity = opacity;
        }
        
        // display the sky
        if(currTime - lastTime <= displayDuration && 
           currTime - lastTime >= transitionDuration){
          canvas.style.opacity = 1.0;
          skySourceElement.style.opacity = 1.0
        }
        
        // show new sky after fadeout of current sky
        if(currTime - lastTime >= (displayDuration + (2 * transitionDuration))){
          lastTime = currTime;
          
          skyIndex = (skyIndex + 1) % skies.length;
          
          const currSky = skies[skyIndex];
          const canvas = document.getElementById('display');
          setSkyImageOnCanvas(canvas, currSky);
        }
        
        requestAnimationFrame(showSkies);
      }
      
      // fetch sky pics per the json file
      const imageList = fetch('skies.json');
      imageList.then(response => {
        const res = response.json();
        res.then(async (data) => {
          data.forEach((sky, idx) => {
            const img = new Image();
            img.src = sky.path;
            
            const newSkyImg = {
              image: img,
              source: sky.source,
            };
            
            img.onload = () => {
              skies.push(newSkyImg);
              
              if(idx === 0){
                const canvas = document.getElementById('display');
                setSkyImageOnCanvas(canvas, newSkyImg);
              }
            };
          });
          
          // create grid of sky pics
          createSkiesGrid(document.getElementById('grid'), data);
          
          requestAnimationFrame(showSkies);
        });
      });
    </script>
  </body>
</html>
